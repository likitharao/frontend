<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="todolist.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="myapp">
 <div class="alltasks">
    <h1>My  ToDo  App</h1>
    <div class="adding">
    <label for="task"><b>Enter a Task</b></label>
    <input type="text" class="task" placeholder="Add a task">

    <button class="btn"><i class="fa-solid fa-plus"></i> Add</button><br><br>
    <label for="duedate"><b>Due date</b></label>    
    <input type="date" id="duedate"> <br><br>
  </div>
</div>
    <div class="all-filters">
        <button id="all"><i class="fas fa-list"></i>  All</button>
        <button id="active"><i class="fas fa-circle-notch"></i>  Active</button>
        <button id="completed"><i class="fas fa-check"></i> Completed</button>
    </div>
    <div class="task-list"></div> 
    </div>
   
  <script src="js/todolist.js"></script>
</body>
</html>
